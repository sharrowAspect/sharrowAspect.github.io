    <img src="images/svg/finger1-web.svg" alt="finger 1 highlighted" class="hand-overlay hand-f1">
    <img src="images/svg/finger2-web.svg" alt="finger 2 highlighted" class="hand-overlay hand-f2">
    <img src="images/svg/finger3-web.svg" alt="finger 3 highlighted" class="hand-overlay hand-f3">
    <img src="images/svg/finger4-web.svg" alt="finger 4 highlighted" class="hand-overlay hand-f4">
    <img src="images/svg/hand_closed-web.svg" alt="hand closed" class="hand-overlay hand-f5">


  <img src="images/svg/word_projects-web.svg" alt="Projects" class="word-label word-projects finger1">

  <img src="images/svg/word_about-web.svg" alt="About" class="word-label word-about finger3">
  <img src="images/svg/word_contact-web.svg" alt="Contact" class="word-label word-contact finger4">

  <img src = "images/svg/detail_projects-web.svg" alt = "Projects detail" class = "word-detail detail-projects finger1">

  <img src = "images/svg/detail_contact-web.svg" alt = "Contact detail" class = "word-detail detail-contact finger4">

  
  <img src = "images/svg/palm_the_world-web.svg" alt = "The World" class = "word-the-world">
  
  

  <!-- invisible click targets, one per word -->
  <button class="hand-btn hand-btn-projects" aria-label="Projects"></button>
  <button class="hand-btn hand-btn-random" aria-label="Random"></button>
  <button class="hand-btn hand-btn-about" aria-label="About"></button>
  <button class="hand-btn hand-btn-contact" aria-label="Contact"></button>
  
  </div>

  <nav>
    <ul>
      <li><a href="#about">About</a></li>
